plugins:
  discourse_sorting_enabled:
    default: true
    client: true
  discourse_sorting_top_candidates:
    default: 500
    min: 20
    max: 5000
  discourse_sorting_portfolio_params:
    default: true
    client: true
  discourse_sorting_tag_counts_limit:
    default: 300
    min: 20
    max: 1000
  discourse_sorting_tag_counts_max_topics:
    default: 50000
    min: 1000
    max: 500000
  discourse_sorting_donations_enabled:
    default: false
    client: true
  discourse_sorting_donations_audience:
    default: admins
    type: enum
    client: true
    choices:
      - admins
      - staff
      - everyone
  discourse_sorting_donations_goal:
    default: 50
    min: 1
    max: 100000
  discourse_sorting_donations_currency:
    default: USD
    type: enum
    choices:
      - USD
      - EUR
      - GBP
      - CAD
      - AUD
  discourse_sorting_donations_title:
    default: "Server costs this month"
  discourse_sorting_donations_message:
    default: ""
  discourse_sorting_donations_button_text:
    default: "Donate"
  discourse_sorting_donations_reached_text:
    default: "Goal reached this month. Thank you!"
  discourse_sorting_donations_dismissible:
    default: false
    client: true
  discourse_sorting_donations_url:
    default: "https://ko-fi.com/fcom"
  discourse_sorting_paypal_mode:
    default: sandbox
    type: enum
    choices:
      - sandbox
      - live
  discourse_sorting_paypal_client_id:
    default: ""
  discourse_sorting_paypal_client_secret:
    default: ""
    secret: true
  discourse_sorting_paypal_webhook_id:
    default: ""
  discourse_sorting_kofi_verification_token:
    default: ""
    secret: true

