en:
  site_settings:
    discourse_sorting_enabled: "Enable the sorting fixes and the booru view helpers (explicit order/ascending on /top, URL sorting on the User Portfolio page, tag counts within a search, per-account booru opt-in)."
    discourse_sorting_top_candidates: "When /top is sorted explicitly (for example order=created), the top N topics of the period are selected first and only those are sorted. Higher values reach further back but cost a larger query."
    discourse_sorting_portfolio_params: "Let the User Portfolio page read order and ascending from the URL, for example ?order=created&ascending=true."
    discourse_sorting_tag_counts_limit: "Most tags returned by the tag counts endpoint (the booru sidebar), highest counts first."
    discourse_sorting_tag_counts_max_topics: "The tag counts endpoint looks at no more than this many topics of a search. Larger values are exact for broad searches but slower."
    discourse_sorting_donations_enabled: "Show the donation thermometer above topic lists and accept Ko-fi and PayPal webhooks (see the README for the setup)."
    discourse_sorting_donations_goal: "Monthly goal, in whole currency units (the server costs to cover). The thermometer resets on the first of each month (UTC)."
    discourse_sorting_donations_currency: "Currency of the goal. Payments in other currencies are stored but not counted."
    discourse_sorting_donations_title: "Heading shown on the thermometer."
    discourse_sorting_donations_url: "Where the Donate button leads (your PayPal subscription or donate link). Leave empty for no button."
    discourse_sorting_paypal_mode: "Use sandbox while testing; switch to live only with live credentials and a live webhook."
    discourse_sorting_paypal_client_id: "Client ID of your PayPal REST app (developer.paypal.com, Apps & Credentials) for the chosen mode."
    discourse_sorting_paypal_client_secret: "Secret of that PayPal REST app. Hidden; never shown to visitors."
    discourse_sorting_paypal_webhook_id: "ID of the webhook you added in that app, pointing at /discourse-sorting/donations/paypal. Used to verify that webhooks really come from PayPal."
    discourse_sorting_kofi_verification_token: "Verification token from Ko-fi (More > API > Webhooks). Ko-fi webhooks are accepted at /discourse-sorting/donations/kofi only when this matches. Hidden; never shown to visitors."
    discourse_sorting_donations_audience: "Who sees the thermometer. Start with admins to try it out, then switch to everyone. Webhooks are recorded whatever this is set to."
